taxonomy:
  package: streamingwam
  model_family: mot_wam
  preset: null
  action_representation: token_action
  conditioning: first_frame

backbone:
  type: wan22_5b
  pretrained_model_id: /path/to/Wan2.2-TI2V-5B
  load_text_encoder: false
  tokenizer_max_len: 128

framework:
  type: mot
  variant: ac-stream
  ac_stream_architecture: starwam_rtc_h32_s16_d8_z1_method3_v2
  action_dim: 14
  action_gripper_dim: -1
  chunk_size: 32
  proprio_dim: 14
  action_video_conditioning: first_frame
  mot_checkpoint_mixed_attn: false
  action_expert_hidden_dim: 1024
  action_expert_init_from: null
  action_expert_head_init: random
  action_expert_use_gradient_checkpointing: false
  video_scheduler:
    num_train_timesteps: 1000
    train_shift: 5.0
    infer_shift: 5.0
  action_scheduler:
    num_train_timesteps: 1000
    train_shift: 5.0
    infer_shift: 5.0
  loss_lambda_video: 1.0
  loss_lambda_action: 1.0

training:
  output_dir: outputs/streamingwam_robotwin_ac_stream
  mixed_precision: bf16

data:
  dataset_type: lerobot
  dataset_dirs: []
  video_key: observation.images.cam_high
  video_keys:
    - observation.images.cam_high
    - observation.images.cam_left_wrist
    - observation.images.cam_right_wrist
  concat_multi_camera: robotwin
  action_key: action
  state_key: observation.state
  num_frames: 33
  video_size: [384, 320]
  text_len: 128
  text_embedding_cache_dir: /path/to/text_embedding_cache
  text_prompt_template: "A video recorded from a robot's point of view executing the following instruction: {task}"
  text_cache_encoder_id: wan22ti2v5b
  action_freq_ratio: 4
  normalize_actions: true
  action_norm_mode: zscore
  action_stats_path: /path/to/action_stats.json
  normalize_states: true
  state_norm_mode: zscore
  state_stats_path: /path/to/action_stats.json
  delta_action_dim_mask: null

inference:
  sampling_method: ac-stream
  num_inference_steps: 1
  action_num_inference_steps: 1
  replan_steps: 16
  seed: 42
  ac_stream_horizon: 32
  ac_stream_stride: 16
  ac_stream_delay: 8
  ac_stream_launch_after_steps: 8
  ac_stream_block_on_miss: true
  ac_stream_backend: accelerated

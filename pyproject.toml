[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwam"
version = "0.1.0"
description = "Streaming world-action models for robot control"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "triton==3.3.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy==1.26.4",
    "ninja==1.13.0",
    "transformers==4.49.0",
    "accelerate==1.12.0",
    "einops==0.8.1",
    "safetensors==0.5.3",
    "huggingface-hub==0.29.2",
    "tokenizers==0.21.4",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "PyYAML==6.0.3",
    "mujoco==3.3.2",
    "robosuite==1.4.0",
    "gym==0.25.2",
    "bddl==1.0.1",
    "PyOpenGL==3.1.10",
    "glfw==2.10.2",
    "opencv-python-headless==4.6.0.66",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "h5py==3.16.0",
    "scipy==1.15.3",
    "numba==0.66.0",
    "cloudpickle==2.1.0",
    "tqdm==4.66.5",
]

[project.optional-dependencies]
train = [
    "deepspeed==0.19.1",
    "wandb==0.23.0",
    "av==12.3.0",
    "datasets==4.4.1",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "timm==1.0.21",
    "rich==14.2.0",
]
dev = [
    "pytest>=7.0",
    "pyright>=1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["streamwam*"]

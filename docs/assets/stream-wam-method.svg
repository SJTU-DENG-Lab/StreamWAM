<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" role="img" aria-labelledby="streamwam-method-title streamwam-method-desc">
  <title id="streamwam-method-title">Stream-WAM streaming overview with a magnified overlap inset</title>
  <desc id="streamwam-method-desc">The global spacetime overview shows two consecutive AC-Stream predictions overlapping continuous robot execution from t zero to t three. A single inset magnifies one overlap window: observation O one starts inference while A zero continues, the shared actions align with the prefix of A one, and known action context conditions the next visual future V one.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#56605b"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#a66f12"/>
    </marker>
    <style>
      .axis{stroke:#303532;stroke-width:1.45;fill:none}
      .landmark{stroke:#aeb3b0;stroke-width:1;fill:none}
      .guide{stroke:#c8cdca;stroke-width:1;stroke-dasharray:4 5;fill:none}
      .connector{stroke:#56605b;stroke-width:1.35;fill:none;marker-end:url(#arrow-gray)}
      .connector-plain{stroke:#707672;stroke-width:1.15;fill:none}
      .gold-path{stroke:#a66f12;stroke-width:1.8;fill:none;marker-end:url(#arrow-gold)}
      .callout{stroke:#8d948f;stroke-width:1.15;stroke-dasharray:5 5;fill:none}
      .title{font:650 20px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#202522}
      .section{font:650 16px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#202522}
      .label{font:500 14px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#2c332f;text-anchor:middle}
      .small{font:500 12px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#66706a;text-anchor:middle}
      .gold-label{font:600 12px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#87580a;text-anchor:middle}
      .mono{font:600 15px/1 ui-monospace,SFMono-Regular,Consolas,monospace;fill:#28302c;text-anchor:middle}
      .time{font:500 15px/1 ui-monospace,SFMono-Regular,Consolas,monospace;fill:#28302c;text-anchor:middle}
      .legend{font:500 12px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#59615c}
    </style>
  </defs>

  <rect width="1600" height="740" fill="#ffffff"/>

  <g id="global-overview">
    <text class="title" x="58" y="40">Streaming overview</text>
    <g id="time-axis">
      <path class="axis" d="M220 64 H1538" marker-end="url(#arrow-gray)"/>
      <line id="time-t0" class="landmark" x1="250" y1="52" x2="250" y2="290"/>
      <line id="time-t1" class="landmark" x1="650" y1="52" x2="650" y2="290"/>
      <line id="time-t2" class="landmark" x1="1050" y1="52" x2="1050" y2="290"/>
      <line id="time-t3" class="landmark" x1="1450" y1="52" x2="1450" y2="290"/>
      <text class="time" x="250" y="44">t₀</text>
      <text class="time" x="650" y="44">t₁</text>
      <text class="time" x="1050" y="44">t₂</text>
      <text class="time" x="1450" y="44">t₃</text>
    </g>

    <g id="overview-cold-start">
      <text class="section" x="58" y="104">Cold start</text>
      <rect x="105" y="123" width="135" height="38" rx="4" fill="#f0efed" stroke="#707672"/>
      <text class="label" x="172.5" y="147">Observation O₀</text>
      <path class="connector" d="M240 142 H288"/>
      <rect id="joint-wam-0" x="295" y="113" width="145" height="58" rx="4" fill="#f5f0e4" stroke="#7a6a44"/>
      <text class="label" x="367.5" y="147">Joint WAM</text>
      <path class="connector-plain" d="M440 142 H468 V121 H478 M468 142 V177 H478"/>
      <rect id="video-0" x="485" y="106" width="125" height="36" rx="4" fill="#e3ebf6" stroke="#4e6f9b"/>
      <text class="mono" x="547.5" y="130">V₀</text>
      <rect id="action-0" x="485" y="158" width="125" height="36" rx="4" fill="#dcece7" stroke="#397c73"/>
      <text class="mono" x="547.5" y="182">A₀</text>
      <path class="connector" d="M610 176 H643"/>
    </g>

    <g id="overview-cycle-1">
      <text class="small" x="850" y="103">continuous motion</text>
      <rect id="overview-execution-0" x="650" y="118" width="400" height="42" rx="3" fill="#dcece7" stroke="#397c73" stroke-width="1.2"/>
      <text class="label" x="850" y="144">Robot execution A₀</text>

      <rect x="682" y="190" width="68" height="34" rx="4" fill="#f0efed" stroke="#707672"/>
      <text class="mono" x="716" y="213">O₁</text>
      <path class="connector" d="M750 207 H753"/>
      <rect id="overview-update-1" x="760" y="177" width="145" height="60" rx="4" fill="#f5f0e4" stroke="#7a6a44"/>
      <text class="label" x="832.5" y="202">AC-Stream</text>
      <text class="small" x="832.5" y="220">update 1</text>
      <path class="connector-plain" d="M905 207 H928 V190 H938 M928 207 V236 H938"/>
      <rect id="overview-video-1" x="945" y="172" width="82" height="36" rx="4" fill="#e3ebf6" stroke="#4e6f9b"/>
      <text class="mono" x="986" y="196">V₁</text>
      <rect id="overview-action-1" x="945" y="222" width="82" height="36" rx="4" fill="#dcece7" stroke="#397c73"/>
      <text class="mono" x="986" y="246">A₁</text>
      <path class="gold-path" d="M905 188 H938"/>
      <text class="gold-label" x="920" y="170">action-conditioned</text>
      <path class="connector" d="M1027 240 H1043 V138 H1050"/>
      <text class="small" x="1018" y="278">handoff</text>
    </g>

    <g id="overview-cycle-2" opacity=".74">
      <rect id="overview-execution-1" x="1050" y="118" width="400" height="42" rx="3" fill="#dcece7" stroke="#397c73" stroke-width="1.2"/>
      <text class="label" x="1250" y="144">Robot execution A₁</text>

      <rect x="1082" y="190" width="68" height="34" rx="4" fill="#f0efed" stroke="#707672"/>
      <text class="mono" x="1116" y="213">O₂</text>
      <path class="connector" d="M1150 207 H1153"/>
      <rect id="overview-update-2" x="1160" y="177" width="145" height="60" rx="4" fill="#f5f0e4" stroke="#7a6a44"/>
      <text class="label" x="1232.5" y="202">AC-Stream</text>
      <text class="small" x="1232.5" y="220">update 2</text>
      <path class="connector-plain" d="M1305 207 H1328 V190 H1338 M1328 207 V236 H1338"/>
      <rect x="1345" y="172" width="82" height="36" rx="4" fill="#e3ebf6" stroke="#4e6f9b"/>
      <text class="mono" x="1386" y="196">V₂</text>
      <rect x="1345" y="222" width="82" height="36" rx="4" fill="#dcece7" stroke="#397c73"/>
      <text class="mono" x="1386" y="246">A₂</text>
      <path class="gold-path" d="M1305 188 H1338"/>
      <path class="connector" d="M1427 240 H1478"/>
      <text class="mono" x="1510" y="246">…</text>
    </g>

    <rect id="inset-selection" x="670" y="168" width="370" height="103" rx="5" fill="none" stroke="#a66f12" stroke-width="1.2" stroke-dasharray="5 5"/>
    <path id="inset-callout" class="callout" d="M1040 271 L1120 330 L1120 355"/>
  </g>

  <path class="guide" d="M58 315 H1540"/>

  <g id="detail-inset">
    <rect id="detail-inset-frame" x="560" y="355" width="960" height="330" rx="5" fill="#fffefa" stroke="#9ca39f" stroke-width="1.1"/>
    <text class="section" x="588" y="386">One overlap window</text>
    <text class="time" x="1378" y="385">t → t + 1</text>

    <text class="mono" x="610" y="437">A₀</text>
    <rect id="inset-a0-before" x="650" y="414" width="180" height="38" rx="3" fill="#dcece7" stroke="#397c73"/>
    <rect id="inset-a0-overlap" x="830" y="414" width="180" height="38" rx="3" fill="#f2dfad" stroke="#a97920" stroke-width="1.2"/>
    <rect id="inset-a0-lookahead" x="1010" y="414" width="180" height="38" rx="3" fill="#f1f2f0" stroke="#b6bbb8"/>
    <text class="small" x="740" y="438">execute</text>
    <text class="gold-label" x="920" y="438">execute + infer</text>
    <text class="small" x="1100" y="438">look-ahead</text>

    <line id="inset-observation" x1="830" y1="394" x2="830" y2="531" stroke="#56605b" stroke-width="1.2"/>
    <circle cx="830" cy="394" r="4" fill="#fff" stroke="#56605b"/>
    <text class="small" x="790" y="400">Observe O₁</text>
    <line x1="830" y1="401" x2="994" y2="401" stroke="#a97920" stroke-width="4"/>
    <text class="gold-label" x="912" y="394">AC-Stream inference</text>

    <text class="mono" x="610" y="510">A₁</text>
    <rect id="inset-a1-prefix" x="830" y="487" width="180" height="38" rx="3" fill="#f2dfad" stroke="#a97920" stroke-width="1.2"/>
    <rect id="inset-a1-continuation" x="1010" y="487" width="300" height="38" rx="3" fill="#dcece7" stroke="#397c73"/>
    <text class="gold-label" x="920" y="510">shared prefix</text>
    <text class="small" x="1160" y="510">continue from handoff</text>
    <text class="gold-label" x="920" y="475">A₀[8:16] = A₁[0:8] · same physical actions</text>
    <path id="inset-handoff" class="connector" d="M1010 453 V472 H1025 V480"/>
    <text class="small" x="1065" y="474">handoff</text>

    <path class="gold-path" d="M920 526 V558"/>
    <rect id="inset-known-context" x="760" y="566" width="160" height="40" rx="3" fill="#f2dfad" stroke="#a97920"/>
    <rect id="inset-unknown-slots" x="920" y="566" width="160" height="40" rx="3" fill="#fafafa" stroke="#9fa5a1" stroke-dasharray="4 3"/>
    <text class="label" x="840" y="591">known action context</text>
    <text class="label" x="1000" y="591">unknown future slots</text>

    <rect x="650" y="626" width="95" height="36" rx="3" fill="#f0efed" stroke="#707672"/>
    <text class="mono" x="697.5" y="650">O₁</text>
    <path id="inset-observation-input" class="connector" d="M745 644 H1095 V617 H1133"/>
    <path id="inset-context-input" class="connector" d="M1080 586 H1133"/>
    <rect id="inset-update" x="1140" y="555" width="125" height="80" rx="4" fill="#f5f0e4" stroke="#7a6a44"/>
    <text class="label" x="1202.5" y="586">AC-Stream</text>
    <text class="small" x="1202.5" y="605">update</text>

    <path id="inset-condition-to-video" class="gold-path" d="M1265 578 H1328"/>
    <path id="inset-action-output" class="connector" d="M1265 616 H1328"/>
    <rect id="inset-video-1" x="1335" y="558" width="105" height="38" rx="3" fill="#e3ebf6" stroke="#4e6f9b"/>
    <text class="mono" x="1387.5" y="582">V₁</text>
    <rect id="inset-action-1" x="1335" y="605" width="105" height="38" rx="3" fill="#dcece7" stroke="#397c73"/>
    <text class="mono" x="1387.5" y="629">A₁</text>
  </g>

  <g transform="translate(62 710)">
    <rect width="14" height="14" fill="#dcece7" stroke="#397c73"/>
    <text class="legend" x="22" y="12">robot execution</text>
    <rect x="144" width="14" height="14" fill="#f5f0e4" stroke="#7a6a44"/>
    <text class="legend" x="166" y="12">model prediction</text>
    <rect x="294" width="14" height="14" fill="#f2dfad" stroke="#a97920"/>
    <text class="legend" x="316" y="12">shared action context</text>
    <rect x="488" width="14" height="14" fill="#e3ebf6" stroke="#4e6f9b"/>
    <text class="legend" x="510" y="12">visual future</text>
    <line x1="624" y1="7" x2="654" y2="7" stroke="#a66f12" stroke-width="2" marker-end="url(#arrow-gold)"/>
    <text class="legend" x="666" y="12">action-conditioned visual generation</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" role="img" aria-labelledby="streamwam-method-title streamwam-method-desc">
  <title id="streamwam-method-title">Stream-WAM asynchronous prediction and execution spacetime diagram</title>
  <desc id="streamwam-method-desc">Cold start: Observation O₀ enters a Joint WAM to produce video V₀ and action A₀. Streaming update 1: while Executing A₀, Observation O₁ and an Aligned action prefix enter the AC-Stream update. The prefix is clamped into the Next action chunk A₁ and its directed condition produces the Action-conditioned video V₁. The same process repeats for V₂ and A₂ before the next handoff.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#555b57"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#aa7415"/>
    </marker>
    <style>
      .axis{stroke:#303532;stroke-width:1.5;fill:none}
      .landmark{stroke:#555b57;stroke-width:1.2;fill:none}
      .separator{stroke:#767c78;stroke-width:1;stroke-dasharray:3 4;fill:none}
      .connector{stroke:#555b57;stroke-width:1.5;fill:none;marker-end:url(#arrow-gray)}
      .branch{stroke:#777d79;stroke-width:1.25;fill:none}
      .condition{stroke:#aa7415;stroke-width:2;fill:none;marker-end:url(#arrow-gold)}
      .extract{stroke:#aa7415;stroke-width:1.6;fill:none;marker-end:url(#arrow-gold)}
      .row-title{font:600 17px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#202522;letter-spacing:.01em}
      .time-label{font:500 18px/1 ui-monospace,SFMono-Regular,Consolas,monospace;fill:#202522}
      .block-label{font:500 14px/1.18 ui-monospace,SFMono-Regular,Consolas,monospace;fill:#242926;text-anchor:middle}
      .symbol-label{font:600 17px/1 ui-monospace,SFMono-Regular,Consolas,monospace;fill:#242926;text-anchor:middle}
      .execution-label{font:500 15px/1 ui-monospace,SFMono-Regular,Consolas,monospace;fill:#234f48;text-anchor:middle}
      .annotation{font:500 13px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#68706c;text-anchor:middle}
      .condition-label{font:500 13px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#8f5d08;text-anchor:middle}
      .legend{font:500 13px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;fill:#555d58}
      .time-cursor{animation:method-time-cursor 8s linear infinite}
      @keyframes method-time-cursor{from{transform:translateX(0)}to{transform:translateX(1230px)}}
      @media (prefers-reduced-motion: reduce){.time-cursor{animation:none!important}}
    </style>
  </defs>

  <rect width="1600" height="860" fill="#ffffff"/>

  <g id="time-axis">
    <path class="axis" d="M60 80 H1542" marker-end="url(#arrow-gray)"/>
    <line id="time-t0" class="landmark" x1="270" y1="66" x2="270" y2="800"/>
    <line id="time-t1" class="landmark" x1="680" y1="66" x2="680" y2="800"/>
    <line id="time-t2" class="landmark" x1="1090" y1="66" x2="1090" y2="800"/>
    <line id="time-t3" class="landmark" x1="1500" y1="66" x2="1500" y2="800"/>
    <text class="time-label" x="270" y="48" text-anchor="middle">t₀</text>
    <text class="time-label" x="680" y="48" text-anchor="middle">t₁</text>
    <text class="time-label" x="1090" y="48" text-anchor="middle">t₂</text>
    <text class="time-label" x="1500" y="48" text-anchor="middle">t₃</text>
  </g>

  <path class="separator" d="M60 300 H1540"/>
  <path class="separator" d="M60 550 H1540"/>
  <path class="separator" d="M60 800 H1540"/>

  <g id="row-cold-start">
    <text class="row-title" x="68" y="132">Cold start</text>
    <rect id="observation-0" x="100" y="170" width="150" height="42" rx="4" fill="#f3e7e3" stroke="#7f625b" stroke-width="1.2"/>
    <text class="block-label" x="175" y="196">Observation O₀</text>

    <path class="connector" d="M250 191 H333"/>
    <rect id="joint-wam-0" x="340" y="160" width="150" height="62" rx="4" fill="#f5f0e4" stroke="#7a6a44" stroke-width="1.2"/>
    <text class="block-label" x="415" y="196">Joint WAM</text>

    <path class="branch" d="M490 191 H510 V169 H520 M510 191 V221 H520"/>
    <text class="annotation" x="595" y="133">joint prediction</text>
    <text class="annotation" x="595" y="150">predicted video</text>
    <rect id="video-0" x="520" y="157" width="150" height="38" rx="4" fill="#e5edf8" stroke="#56749d" stroke-width="1.2"/>
    <text class="symbol-label" x="595" y="182">V₀</text>
    <text class="annotation" x="595" y="216">action chunk</text>
    <rect id="action-0" x="520" y="223" width="150" height="38" rx="4" fill="#e4efe3" stroke="#557c58" stroke-width="1.2"/>
    <text class="symbol-label" x="595" y="248">A₀</text>

    <path id="action-handoff-0" class="connector" d="M670 242 H675 V339 L680 339"/>
  </g>

  <g id="row-stream-1">
    <text class="row-title" x="68" y="330">Streaming update 1</text>
    <rect id="execution-0" x="680" y="320" width="410" height="38" rx="2" fill="#d8ece8" stroke="#397c73" stroke-width="1.2"/>
    <text class="execution-label" x="885" y="344">Executing A₀</text>

    <text class="annotation" x="755" y="394">observation</text>
    <rect id="observation-1" x="700" y="402" width="110" height="38" rx="4" fill="#efefed" stroke="#707672" stroke-width="1.2"/>
    <text class="symbol-label" x="755" y="427">O₁</text>

    <path class="extract" d="M750 358 V451 H755 V458"/>
    <rect id="aligned-prefix-1" x="700" y="458" width="110" height="48" rx="4" fill="#f7edd2" stroke="#a97920" stroke-width="1.2"/>
    <text class="block-label" x="755" y="478">
      <tspan x="755">Aligned action</tspan>
      <tspan x="755" dy="17">prefix</tspan>
    </text>

    <path class="connector" d="M810 421 H823"/>
    <path id="prefix-input-1" class="condition" d="M810 482 H820 L830 472"/>
    <rect id="ac-update-1" x="830" y="405" width="115" height="100" rx="4" fill="#f5f0e4" stroke="#7a6a44" stroke-width="1.2"/>
    <text class="block-label" x="887.5" y="441">
      <tspan x="887.5">AC-Stream</tspan>
      <tspan x="887.5" dy="18">update</tspan>
    </text>
    <text class="condition-label" x="887.5" y="489">prefix clamped</text>

    <path class="connector" d="M945 481 H948 L955 481"/>
    <path id="prefix-to-video-1" class="condition" d="M830 472 H935 V419 H945 L955 419"/>
    <text class="condition-label" x="887.5" y="389">directed to V₁</text>

    <text class="annotation" x="1017.5" y="391">visual future</text>
    <rect id="video-1" x="955" y="400" width="125" height="42" rx="4" fill="#dfe9f7" stroke="#466a99" stroke-width="1.3"/>
    <text class="symbol-label" x="1017.5" y="427">V₁</text>

    <text class="annotation" x="1017.5" y="457">next action chunk</text>
    <rect id="action-1" x="955" y="466" width="125" height="42" rx="4" fill="#deebdd" stroke="#47744c" stroke-width="1.3"/>
    <rect id="action-prefix-clamp-1" x="957" y="468" width="28" height="38" rx="2" fill="#ecd59c"/>
    <text class="symbol-label" x="1017.5" y="493">A₁</text>
    <text class="condition-label" x="1017.5" y="526">prefix | continuation</text>

    <path id="action-handoff-1" class="connector" d="M1080 487 H1085 V589 L1090 589"/>
    <text class="annotation" x="1118" y="540">handoff</text>
  </g>

  <g id="row-stream-2" opacity=".74">
    <text class="row-title" x="68" y="580">Streaming update 2</text>
    <rect id="execution-1" x="1090" y="570" width="410" height="38" rx="2" fill="#d8ece8" stroke="#397c73" stroke-width="1.2"/>
    <text class="execution-label" x="1295" y="594">Executing A₁</text>

    <text class="annotation" x="1165" y="644">observation</text>
    <rect id="observation-2" x="1110" y="652" width="110" height="38" rx="4" fill="#efefed" stroke="#707672" stroke-width="1.2"/>
    <text class="symbol-label" x="1165" y="677">O₂</text>

    <path class="extract" d="M1160 608 V701 H1165 V708"/>
    <rect id="aligned-prefix-2" x="1110" y="708" width="110" height="48" rx="4" fill="#f7edd2" stroke="#a97920" stroke-width="1.2"/>
    <text class="block-label" x="1165" y="728">
      <tspan x="1165">Aligned action</tspan>
      <tspan x="1165" dy="17">prefix</tspan>
    </text>

    <path class="connector" d="M1220 671 H1233"/>
    <path id="prefix-input-2" class="condition" d="M1220 732 H1230 L1240 722"/>
    <rect id="ac-update-2" x="1240" y="655" width="115" height="100" rx="4" fill="#f5f0e4" stroke="#7a6a44" stroke-width="1.2"/>
    <text class="block-label" x="1297.5" y="691">
      <tspan x="1297.5">AC-Stream</tspan>
      <tspan x="1297.5" dy="18">update</tspan>
    </text>
    <text class="condition-label" x="1297.5" y="739">prefix clamped</text>

    <path class="connector" d="M1355 731 H1358 L1365 731"/>
    <path id="prefix-to-video-2" class="condition" d="M1240 722 H1345 V669 H1355 L1365 669"/>
    <text class="condition-label" x="1297.5" y="639">directed to V₂</text>

    <text class="annotation" x="1427.5" y="641">visual future</text>
    <rect id="video-2" x="1365" y="650" width="125" height="42" rx="4" fill="#dfe9f7" stroke="#466a99" stroke-width="1.3"/>
    <text class="symbol-label" x="1427.5" y="677">V₂</text>

    <text class="annotation" x="1427.5" y="707">next action chunk</text>
    <rect id="action-2" x="1365" y="716" width="125" height="42" rx="4" fill="#deebdd" stroke="#47744c" stroke-width="1.3"/>
    <rect id="action-prefix-clamp-2" x="1367" y="718" width="28" height="38" rx="2" fill="#ecd59c"/>
    <text class="symbol-label" x="1427.5" y="743">A₂</text>
    <path class="connector" d="M1490 737 H1530"/>
    <text class="time-label" x="1542" y="743">…</text>
  </g>

  <g id="time-cursor" class="time-cursor" opacity=".24" aria-hidden="true">
    <line x1="270" y1="70" x2="270" y2="790" stroke="#087d70" stroke-width="2"/>
    <path d="M264 70 L276 70 L270 80 Z" fill="#087d70"/>
  </g>

  <g transform="translate(72 829)">
    <rect width="14" height="14" fill="#efefed" stroke="#707672"/>
    <text class="legend" x="23" y="12">observation</text>
    <rect x="126" width="14" height="14" fill="#e5edf8" stroke="#56749d"/>
    <text class="legend" x="149" y="12">predicted video</text>
    <rect x="286" width="14" height="14" fill="#e4efe3" stroke="#557c58"/>
    <text class="legend" x="309" y="12">action / execution</text>
    <rect x="467" width="14" height="14" fill="#ecd59c" stroke="#a97920"/>
    <text class="legend" x="490" y="12">clamped action prefix</text>
    <line x1="662" y1="7" x2="691" y2="7" stroke="#aa7415" stroke-width="2" marker-end="url(#arrow-gold)"/>
    <text class="legend" x="702" y="12">directed visual conditioning</text>
  </g>
</svg>
